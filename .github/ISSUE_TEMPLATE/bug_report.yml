name: Bug report
description: "Report a reproducible problem with the app."
labels: ["bug"]
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you give, the faster we can reproduce and fix it.
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: A concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        1. Go to ...
        2. Click on ...
        3. Scroll down to ...
        4. See error
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Scroll down to ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, and runtime version.
      placeholder: |
        - OS: Windows 11 / macOS 14 / Ubuntu 22.04
        - Browser: Chrome 125, Firefox 126, Safari 17
        - Node.js: 20.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / console errors
      description: Paste any error output here. Use code blocks if possible.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem. Paste images directly or use an image-upload link.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical — app is broken / data loss
        - High — major feature unusable
        - Medium — feature partially broken, workaround exists
        - Low — cosmetic / minor UX issue
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem.
